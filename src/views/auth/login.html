{% extends 'base.html' %}
{% block title %}Login - Campus Resource Hub{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </h2>
        <form method="post" class="needs-validation" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <div class="mb-3">
            <label class="form-label" for="email">
              <i class="bi bi-envelope"></i> Email Address
            </label>
            <input id="email" name="email" type="email" class="form-control" placeholder="your.email@campus.edu" required autofocus>
            <div class="invalid-feedback">Please provide a valid email address.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">
              <i class="bi bi-lock"></i> Password
            </label>
            <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" required>
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary btn-lg" type="submit">
              <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
          </div>
          <div class="text-center mt-3">
            <p class="text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
